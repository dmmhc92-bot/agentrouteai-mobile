<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentRoute AI - Legal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F172A;
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #3B82F6;
            font-size: 36px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94A3B8;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            margin: 0 auto;
        }
        a {
            display: block;
            background: #1E293B;
            color: #3B82F6;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
        }
        a:hover {
            background: #334155;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 50px;
            color: #64748B;
            font-size: 14px;
        }

    <div class="container">
        <h1>AgentRoute AI</h1>
